<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Items — Inventory</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Inventory</h2>

    <a href="index.html"><i class="fa-solid fa-chart-line"></i> <span>Dashboard</span></a>
    <a href="items.html" class="active"><i class="fa-solid fa-box"></i> <span>Items</span></a>
    <a href="transactions.html"><i class="fa-solid fa-right-left"></i> <span>Transactions</span></a>
    <a href="reports.html"><i class="fa-solid fa-chart-pie"></i> <span>Reports</span></a>

    <div class="sidebar-footer">
      <span id="userInfo"></span>
      <button id="logoutBtn" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <div class="page-header">
      <h2>Inventory Items</h2>
      <p class="page-subtitle">Manage your products and stock levels</p>
    </div>

    <!-- ADD ITEM FORM -->
    <form id="itemForm">
      <input type="text"   id="item_name"  placeholder="Item Name"  required>
      <input type="text"   id="category"   placeholder="Category"   required>
      <input type="number" id="quantity"   placeholder="Quantity"   min="1"  required>
      <input type="number" id="unit_price" placeholder="Unit Price" min="0"  step="0.01" required>
      <button type="submit">
        <i class="fa-solid fa-plus"></i> Add Item
      </button>
    </form>

    <!-- SEARCH -->
    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Search items..."
      onkeyup="filterItems()"
      style="margin-bottom:15px; padding:10px; width:100%; border-radius:6px; box-sizing:border-box;"
    >

    <!-- TABLE -->
    <div style="width:100%; text-align:left;">
      <h3>Items List</h3>
      <table id="itemsTable" class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="itemsTableBody"></tbody>
      </table>
    </div>

  </main>

</div>

<!-- toast MUST come before auth.js so showToast is defined -->
<script src="js/toast.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

</body>
</html>
