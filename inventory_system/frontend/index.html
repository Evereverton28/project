<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Inventory</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Inventory</h2>
    <a href="index.html" class="active"><i class="fa-solid fa-chart-line"></i> <span>Dashboard</span></a>
    <a href="items.html"><i class="fa-solid fa-box"></i> <span>Items</span></a>
    <a href="transactions.html"><i class="fa-solid fa-right-left"></i> <span>Transactions</span></a>
    <a href="reports.html"><i class="fa-solid fa-chart-pie"></i> <span>Reports</span></a>
    <div class="sidebar-footer">
      <span id="userInfo"></span>
      <button id="logoutBtn" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <div class="page-header">
      <h2>Dashboard</h2>
      <p class="page-subtitle">Live overview of your inventory</p>
    </div>

    <!-- STAT CARDS -->
    <div class="stat-cards">
      <div class="stat-card" id="card-items">
        <div class="stat-icon"><i class="fa-solid fa-box"></i></div>
        <div class="stat-body">
          <div class="stat-label">Total Items</div>
          <div class="stat-value" id="totalItems">
            <span class="skeleton-line" style="width:60px"></span>
          </div>
          <div class="stat-sub">unique products</div>
        </div>
      </div>
      <div class="stat-card" id="card-value">
        <div class="stat-icon"><i class="fa-solid fa-coins"></i></div>
        <div class="stat-body">
          <div class="stat-label">Stock Value</div>
          <div class="stat-value" id="totalValue">
            <span class="skeleton-line" style="width:90px"></span>
          </div>
          <div class="stat-sub">total KES</div>
        </div>
      </div>
      <div class="stat-card" id="card-txn">
        <div class="stat-icon"><i class="fa-solid fa-right-left"></i></div>
        <div class="stat-body">
          <div class="stat-label">Transactions</div>
          <div class="stat-value" id="totalTransactions">
            <span class="skeleton-line" style="width:50px"></span>
          </div>
          <div class="stat-sub">all time</div>
        </div>
      </div>
      <div class="stat-card danger" id="card-low">
        <div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="stat-body">
          <div class="stat-label">Low Stock</div>
          <div class="stat-value" id="lowStockCount">
            <span class="skeleton-line" style="width:40px"></span>
          </div>
          <div class="stat-sub">items need attention</div>
        </div>
      </div>
    </div>

    <!-- PANELS ROW -->
    <div class="panels-row">

      <!-- LOW STOCK ALERTS -->
      <div class="panel">
        <div class="panel-header">
          <i class="fa-solid fa-circle-exclamation"></i>
          <h3>Low Stock Alerts</h3>
        </div>
        <div id="lowStockList">
          <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
        </div>
      </div>

      <!-- RECENT TRANSACTIONS -->
      <div class="panel">
        <div class="panel-header">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <h3>Recent Transactions</h3>
        </div>
        <div id="recentTxns">
          <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
        </div>
      </div>

    </div>
  </main>

</div>

<script src="js/toast.js"></script>
<script src="js/auth.js"></script>
<script>
  const API_BASE = "http://127.0.0.1:5000";

  /* ---- populate sidebar ---- */
  const username = sessionStorage.getItem("username");
  if (username) document.getElementById("userInfo").textContent = `Logged in as: ${username}`;

  /* ---- fetch & render dashboard ---- */
  async function loadDashboard() {
    // FIX #14: read the threshold the user last set in Reports (defaults to 5)
    const lowThreshold = parseInt(sessionStorage.getItem("lowThreshold") || "5");

    try {
      // FIX #6: send auth headers on both requests
      const [reportsRes, txnRes] = await Promise.all([
        fetch(`${API_BASE}/reports?low_threshold=${lowThreshold}`, { headers: authHeaders() }),
        fetch(`${API_BASE}/transactions`,                           { headers: authHeaders() }),
      ]);
      const reports = await reportsRes.json();
      const txns    = await txnRes.json();

      /* stat cards */
      document.getElementById("totalItems").textContent        = reports.total_items;
      document.getElementById("totalValue").textContent        = `KES ${Number(reports.total_value).toLocaleString()}`;
      document.getElementById("totalTransactions").textContent = reports.total_transactions;
      document.getElementById("lowStockCount").textContent     = reports.low_stock.length;

      /* low stock list */
      const lowEl = document.getElementById("lowStockList");
      if (reports.low_stock.length === 0) {
        lowEl.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-check"></i><p>All items are well stocked</p></div>`;
      } else {
        lowEl.innerHTML = reports.low_stock.map(item => `
          <div class="alert-row">
            <span class="alert-item-name">${item.item_name}</span>
            <span class="badge danger">${item.quantity} left</span>
          </div>
        `).join("");
      }

      /* recent transactions — API returns newest-first; show top 5 */
      // FIX #13 (applied here too): no .reverse() needed — already sorted DESC
      const recentEl = document.getElementById("recentTxns");
      const recent   = txns.slice(0, 5);
      if (recent.length === 0) {
        recentEl.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>No transactions yet</p></div>`;
      } else {
        recentEl.innerHTML = recent.map(t => `
          <div class="txn-row">
            <span class="badge ${t.type === 'IN' ? 'success' : 'danger'}">${t.type}</span>
            <div class="txn-info">
              <span class="txn-name">${t.item_name}</span>
              <span class="txn-date">${new Date(t.date).toLocaleString()}</span>
            </div>
            <span class="txn-qty ${t.type === 'IN' ? 'qty-in' : 'qty-out'}">
              ${t.type === 'IN' ? '+' : '-'}${t.quantity}
            </span>
          </div>
        `).join("");
      }

    } catch (err) {
      console.error("Dashboard load error:", err);
      document.querySelectorAll(".stat-value").forEach(el => el.textContent = "—");
      document.getElementById("lowStockList").innerHTML = `<div class="empty-state error">Could not load data</div>`;
      document.getElementById("recentTxns").innerHTML  = `<div class="empty-state error">Could not load data</div>`;
    }
  }

  document.addEventListener("DOMContentLoaded", loadDashboard);
</script>

</body>
</html>
